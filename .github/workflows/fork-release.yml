name: Fork release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'jmilldotdev/parachord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.version.outputs.upstream }}
      fork: ${{ steps.version.outputs.fork }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: version
        name: Compute release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const upstream = require('./package.json').version;
          const core = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(upstream);
          if (!core) throw new Error(`Invalid upstream version: ${upstream}`);
          const [, major, minor, patch] = core;
          const fork = `${major}.${minor}.${Number(patch) + Number(process.env.GITHUB_RUN_NUMBER)}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `upstream=${upstream}\nfork=${fork}\n`);
          NODE

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            manifest: latest-mac.yml
          - os: macos-latest
            platform: mac
            arch: x64
            manifest: latest-mac.yml
          - os: ubuntu-latest
            platform: linux
            arch: x64
            manifest: latest-linux.yml
    env:
      FORK_VERSION: ${{ needs.version.outputs.fork }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Stamp version and embed optional MusicKit developer token
        env:
          MUSICKIT_DEVELOPER_TOKEN: ${{ secrets.MUSICKIT_DEVELOPER_TOKEN }}
          MUSICKIT_PRIVATE_KEY: ${{ secrets.MUSICKIT_PRIVATE_KEY }}
          MUSICKIT_TEAM_ID: ${{ secrets.MUSICKIT_TEAM_ID }}
          MUSICKIT_KEY_ID: ${{ secrets.MUSICKIT_KEY_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { SignJWT, decodeJwt, importPKCS8 } from 'jose';

          const env = process.env;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = env.FORK_VERSION;
          pkg.build.publish = { provider: 'github', owner: 'jmilldotdev', repo: 'parachord' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          let token = env.MUSICKIT_DEVELOPER_TOKEN.trim();
          if (!token && env.MUSICKIT_PRIVATE_KEY) {
            if (!env.MUSICKIT_TEAM_ID || !env.MUSICKIT_KEY_ID) {
              throw new Error('Set both MUSICKIT_TEAM_ID and MUSICKIT_KEY_ID with MUSICKIT_PRIVATE_KEY');
            }
            const key = await importPKCS8(env.MUSICKIT_PRIVATE_KEY.trim(), 'ES256');
            token = await new SignJWT({})
              .setProtectedHeader({ alg: 'ES256', kid: env.MUSICKIT_KEY_ID })
              .setIssuer(env.MUSICKIT_TEAM_ID)
              .setIssuedAt()
              .setExpirationTime('30d')
              .sign(key);
            console.log(`::add-mask::${token}`);
          }
          if (token) {
            const { exp } = decodeJwt(token);
            if (!exp || exp * 1000 <= Date.now()) throw new Error('MusicKit developer token is expired or missing exp');
            // Only the distributable JWT ships; no private key is written to disk.
            const source = fs.readFileSync('main.js', 'utf8');
            fs.writeFileSync('main.js', `process.env.MUSICKIT_DEVELOPER_TOKEN ||= ${JSON.stringify(token)};\n${source}`);
          }
          NODE

      - name: Build macOS package
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          UPSTREAM_VERSION: ${{ needs.version.outputs.upstream }}
        run: |
          set -euo pipefail
          # Stapling changes DMG bytes. Only ZIPs belong in the macOS update feed.
          args=( "--$ARCH" --publish never '-c.artifactName=Parachord-${version}-${arch}.${ext}' '-c.dmg.writeUpdateInfo=false' "-c.mac.bundleVersion=${UPSTREAM_VERSION%%[-+]*}" )
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY_P8" ]]; then
            umask 077
            cert="$RUNNER_TEMP/fork-signing.p12"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            export CSC_KEYCHAIN="$RUNNER_TEMP/fork-signing.keychain-db"
            password=$(openssl rand -hex 24)
            printf '%s' "$CSC_LINK" | base64 --decode > "$cert"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
            security create-keychain -p "$password" "$CSC_KEYCHAIN"
            security set-keychain-settings -lut 21600 "$CSC_KEYCHAIN"
            security unlock-keychain -p "$password" "$CSC_KEYCHAIN"
            security import "$cert" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$CSC_KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$CSC_KEYCHAIN"
            security list-keychains -d user -s "$CSC_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8
            umask 022
            args+=( '-c.mac.notarize=true' '-c.forceCodeSigning=true' '-c.dmg.sign=true' )
            mode=notarized
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8
            args+=( '-c.mac.identity=-' )
            mode=ad-hoc
          fi
          echo "macOS signature mode: $mode"
          npm run build:mac -- "${args[@]}"
          app=(dist/mac*/Parachord.app)
          test -d "${app[0]}"
          codesign --verify --deep --strict "${app[0]}"
          signature=$(codesign -dv --verbose=2 "${app[0]}" 2>&1)
          if [[ "$mode" == notarized ]]; then
            grep -q '^Authority=Developer ID Application' <<< "$signature"
            xcrun stapler validate "${app[0]}"
            for file in dist/*.dmg dist/*.zip; do
              result=$(xcrun notarytool submit "$file" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json)
              if ! jq -e '.status == "Accepted"' <<< "$result"; then
                printf '%s\n' "$result"
                exit 1
              fi
              if [[ "$file" == *.dmg ]]; then
                xcrun stapler staple "$file"
                xcrun stapler validate "$file"
              fi
            done
          else
            grep -Fxq 'Signature=adhoc' <<< "$signature"
          fi
          feed="${app[0]}/Contents/Resources/app-update.yml"
          grep -Fx 'provider: github' "$feed"
          grep -Fx 'owner: jmilldotdev' "$feed"
          grep -Fx 'repo: parachord' "$feed"
          printf '%s\n' "$mode" > "dist/macos-${ARCH}-signing.txt"

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: npm run build:linux -- AppImage --x64 --publish never '-c.artifactName=Parachord-${version}-${arch}.${ext}'

      - uses: actions/upload-artifact@v7
        with:
          name: fork-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/macos-*-signing.txt
            dist/${{ matrix.manifest }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORK_VERSION: ${{ needs.version.outputs.fork }}
      UPSTREAM_VERSION: ${{ needs.version.outputs.upstream }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: fork-*
          path: builds

      - name: Combine and verify updater manifests
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import yaml

          version = os.environ['FORK_VERSION']
          output = Path('release')
          output.mkdir()

          def load(build, manifest, expected):
              path = Path('builds') / build
              info = yaml.safe_load((path / manifest).read_text())
              assert info['version'] == version, (build, info['version'], version)
              for suffix in expected:
                  assert len(list(path.glob('*' + suffix))) == 1, (build, suffix)
              for asset in info['files']:
                  file = path / asset['url']
                  assert file.parent == path and file.is_file(), asset['url']
                  with file.open('rb') as stream:
                      checksum = base64.b64encode(hashlib.file_digest(stream, 'sha512').digest()).decode()
                  assert checksum == asset['sha512'], asset['url']
                  assert file.stat().st_size == asset['size'], asset['url']
              for file in path.iterdir():
                  if file.suffix in {'.zip', '.dmg', '.AppImage', '.blockmap'}:
                      assert not (output / file.name).exists(), file.name
                      shutil.move(file, output / file.name)
              return info

          mac = load('fork-mac-arm64', 'latest-mac.yml', ('-arm64.zip', '-arm64.dmg'))
          intel = load('fork-mac-x64', 'latest-mac.yml', ('-x64.zip', '-x64.dmg'))
          linux = load('fork-linux-x64', 'latest-linux.yml', ('-x64.AppImage',))
          assert any(item['url'].endswith('-arm64.zip') for item in mac['files'])
          assert any(item['url'].endswith('-x64.zip') for item in intel['files'])
          mac['files'].extend(intel['files'])
          (output / 'latest-mac.yml').write_text(yaml.safe_dump(mac, sort_keys=False))
          (output / 'latest-linux.yml').write_text(yaml.safe_dump(linux, sort_keys=False))
          PY

      - name: Publish to the fork
        run: |
          set -euo pipefail
          tag="v$FORK_VERSION"
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')
          if [[ "$tag" == "$latest" ]]; then
            echo "Release $tag already exists."
            exit 0
          fi
          if [[ -n "$latest" && "$(printf '%s\n' "${latest#v}" "$FORK_VERSION" | sort -V | tail -1)" != "$FORK_VERSION" ]]; then
            echo "::error::$tag is older than $latest; dispatch a new release instead."
            exit 1
          fi
          mode=$(cat builds/fork-mac-arm64/macos-arm64-signing.txt)
          test "$mode" = "$(cat builds/fork-mac-x64/macos-x64-signing.txt)"
          {
            printf 'Fork build from `%s` (upstream package version `%s`).\n\n' "$GITHUB_SHA" "$UPSTREAM_VERSION"
            if [[ "$mode" == ad-hoc ]]; then
              echo '**macOS build: ad-hoc signed, not notarized.** Use the DMG for manual installation. In-app macOS updates are not supported on this build.'
            else
              echo '**macOS build: Developer ID signed and notarized.** After the initial manual install, use the in-app updater for newer signed fork builds.'
            fi
          } > release-notes.md
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Parachord Fork $tag" --notes-file release-notes.md --latest
